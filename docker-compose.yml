services:
  postgres:
    image: postgres:16
    container_name: expensewise-postgres
    environment:
      POSTGRES_DB: expensewise
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5433:5432"
    volumes:
      - expensewise_pgdata:/var/lib/postgresql/data

volumes:
  expensewise_pgdata:
