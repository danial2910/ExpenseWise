spring:
  application:
    name: expensewise
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      # Above UserService's own 2 MB avatar cap, so a rejected file gets our
      # clean "avatar" validation error instead of Spring's default 1 MB
      # MaxUploadSizeExceededException surfacing as a raw 500.
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    com.expensewise: INFO

cookie:
  secure: false

groq:
  base-url: https://api.groq.com/openai/v1
