spring:
  application:
    name: expensewise
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      # Above ReceiptService's own 5 MB cap (the largest of any multipart
      # upload — avatars are capped at 2 MB), so a rejected file gets our
      # clean validation error instead of Spring's default 1 MB
      # MaxUploadSizeExceededException surfacing as a raw 500.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  # Render (prod host) injects its own listen port via $PORT at runtime;
  # everywhere else (local, CI) nothing sets PORT so this falls back to 8080
  # unchanged.
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    com.expensewise: INFO

app:
  cors:
    # Comma-separated list of allowed origins, CorsConfig splits on ",".
    # Local/CI/test never set this env var, so this default (unchanged) is
    # what they get. Prod sets APP_CORS_ALLOWED_ORIGINS_EXPENSEWISE to the
    # deployed Vercel URL.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS_EXPENSEWISE:http://localhost:5173}

cookie:
  secure: false
  # Lax works for local/CI where frontend and backend share a host (just
  # different ports). Cross-site prod (Vercel <-> Render) needs None, set in
  # application-prod.yml — see RefreshCookieFactory.
  same-site: Lax

groq:
  base-url: https://api.groq.com/openai/v1

newsdata:
  base-url: https://newsdata.io/api/1
  # Shared across every user (one upstream call serves everyone within the
  # window) — 20 minutes, inside the 15-30 min range the task asked for.
  cache-ttl-seconds: 1200
