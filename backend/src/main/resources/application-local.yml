spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/expensewise}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:devpass}
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: true
  mail:
    host: ${BREVO_SMTP_HOST:}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USER:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

cookie:
  secure: false

logging:
  level:
    org.hibernate.SQL: DEBUG
