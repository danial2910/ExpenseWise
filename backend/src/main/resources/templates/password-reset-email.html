<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reset your ExpenseWise password</title>
</head>
<body style="margin:0; padding:32px; background:#F1F5F9; font-family:Arial, sans-serif;">
    <table role="presentation" width="100%" style="max-width:420px; margin:0 auto; background:#FFFFFF; border:1px solid #E2E8F0; border-radius:8px; padding:32px;">
        <tr>
            <td>
                <h1 style="font-size:18px; color:#0F172A; margin:0 0 12px;">Reset your password</h1>
                <p style="font-size:14px; color:#475569; margin:0 0 20px;">
                    We received a request to reset your ExpenseWise password. This link expires in 30 minutes.
                </p>
                <a th:href="${resetLink}"
                   style="display:inline-block; background:#4F46E5; color:#FFFFFF; font-size:14px; font-weight:600; padding:10px 16px; border-radius:8px; text-decoration:none;">
                    Reset password
                </a>
                <p style="font-size:12px; color:#94A3B8; margin-top:24px;">
                    If you didn't request this, you can safely ignore this email.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
